services:
  web:
    build: ./apps/web
    ports: ["3000:80"]
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  identity-service:
    build: ./services/identity-service
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      MAX_DID_DOCUMENT_BYTES: ${MAX_DID_DOCUMENT_BYTES:-16384}
      MAX_CREDENTIAL_BYTES: ${MAX_CREDENTIAL_BYTES:-32768}
      MAX_CREDENTIAL_REQUEST_BYTES: ${MAX_CREDENTIAL_REQUEST_BYTES:-36864}
      MAX_AUTH_REQUEST_BYTES: ${MAX_AUTH_REQUEST_BYTES:-4096}
      MAX_REVOCATION_REQUEST_BYTES: ${MAX_REVOCATION_REQUEST_BYTES:-4096}
      MAX_PRESENTATION_REQUEST_BYTES: ${MAX_PRESENTATION_REQUEST_BYTES:-69632}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:-32}
      DID_NETWORK_RESOLUTION_ENABLED: ${DID_NETWORK_RESOLUTION_ENABLED:-false}
      IDENTITY_ENVIRONMENT: ${IDENTITY_ENVIRONMENT:-development}
      IDENTITY_AUTH_ENABLED: ${IDENTITY_AUTH_ENABLED:-true}
      IDENTITY_AUTH_JWT_ISSUER: ${IDENTITY_AUTH_JWT_ISSUER:-secure-ssi-identity-service}
      IDENTITY_AUTH_JWT_AUDIENCE: ${IDENTITY_AUTH_JWT_AUDIENCE:-identity-service}
      IDENTITY_AUTH_ACCESS_TOKEN_SECONDS: ${IDENTITY_AUTH_ACCESS_TOKEN_SECONDS:-900}
      IDENTITY_AUTH_JWT_ALGORITHM: ${IDENTITY_AUTH_JWT_ALGORITHM:-HS256}
      IDENTITY_AUTH_JWT_SECRET: ${IDENTITY_AUTH_JWT_SECRET:-}
      IDENTITY_AUTH_FIXTURE_USERS_ENABLED: ${IDENTITY_AUTH_FIXTURE_USERS_ENABLED:-true}
      IDENTITY_AUTH_CLOCK_SKEW_SECONDS: ${IDENTITY_AUTH_CLOCK_SKEW_SECONDS:-10}
      IDENTITY_AUTH_USER_PROVIDER: ${IDENTITY_AUTH_USER_PROVIDER:-synthetic}
      IDENTITY_MONGO_ENABLED: ${IDENTITY_MONGO_ENABLED:-true}
      IDENTITY_MONGO_URI: ${IDENTITY_MONGO_URI:-mongodb://identity_app:change-me-app@mongodb:27017/secure_identity?authSource=secure_identity}
      IDENTITY_MONGO_DATABASE: ${IDENTITY_MONGO_DATABASE:-secure_identity}
      IDENTITY_MONGO_SERVER_SELECTION_TIMEOUT_MS: ${IDENTITY_MONGO_SERVER_SELECTION_TIMEOUT_MS:-3000}
      IDENTITY_MONGO_CONNECT_TIMEOUT_MS: ${IDENTITY_MONGO_CONNECT_TIMEOUT_MS:-3000}
      IDENTITY_MONGO_SOCKET_TIMEOUT_MS: ${IDENTITY_MONGO_SOCKET_TIMEOUT_MS:-5000}
      IDENTITY_MONGO_MAX_POOL_SIZE: ${IDENTITY_MONGO_MAX_POOL_SIZE:-50}
      IDENTITY_MONGO_MIN_POOL_SIZE: ${IDENTITY_MONGO_MIN_POOL_SIZE:-0}
      IDENTITY_MONGO_RETRY_READS: ${IDENTITY_MONGO_RETRY_READS:-true}
      IDENTITY_MONGO_RETRY_WRITES: ${IDENTITY_MONGO_RETRY_WRITES:-true}
      IDENTITY_MONGO_APP_NAME: ${IDENTITY_MONGO_APP_NAME:-secure-ssi-identity-service}
      IDENTITY_STATUS_LIST_PUBLIC_BASE_URL: ${IDENTITY_STATUS_LIST_PUBLIC_BASE_URL:-http://localhost:8001/api/v1/status-lists}
      IDENTITY_STATUS_LIST_LENGTH: ${IDENTITY_STATUS_LIST_LENGTH:-131072}
      IDENTITY_STATUS_LIST_CAPACITY: ${IDENTITY_STATUS_LIST_CAPACITY:-131072}
      IDENTITY_STATUS_LIST_TTL_SECONDS: ${IDENTITY_STATUS_LIST_TTL_SECONDS:-300}
      IDENTITY_AUDIT_OUTBOX_ENABLED: ${IDENTITY_AUDIT_OUTBOX_ENABLED:-true}
      IDENTITY_AUDIT_OUTBOX_POLL_INTERVAL_MS: ${IDENTITY_AUDIT_OUTBOX_POLL_INTERVAL_MS:-1000}
      IDENTITY_AUDIT_OUTBOX_BATCH_SIZE: ${IDENTITY_AUDIT_OUTBOX_BATCH_SIZE:-100}
      IDENTITY_AUDIT_OUTBOX_BASE_RETRY_SECONDS: ${IDENTITY_AUDIT_OUTBOX_BASE_RETRY_SECONDS:-1}
      IDENTITY_AUDIT_OUTBOX_MAX_RETRY_SECONDS: ${IDENTITY_AUDIT_OUTBOX_MAX_RETRY_SECONDS:-300}
      IDENTITY_AUDIT_OUTBOX_LEASE_SECONDS: ${IDENTITY_AUDIT_OUTBOX_LEASE_SECONDS:-30}
      IDENTITY_PRESENTATION_CHALLENGE_LIFETIME_SECONDS: ${IDENTITY_PRESENTATION_CHALLENGE_LIFETIME_SECONDS:-300}
      IDENTITY_PRESENTATION_RECONCILIATION_ENABLED: ${IDENTITY_PRESENTATION_RECONCILIATION_ENABLED:-true}
      IDENTITY_PRESENTATION_RECONCILIATION_STALE_SECONDS: ${IDENTITY_PRESENTATION_RECONCILIATION_STALE_SECONDS:-60}
      IDENTITY_PRESENTATION_RECONCILIATION_POLL_INTERVAL_MS: ${IDENTITY_PRESENTATION_RECONCILIATION_POLL_INTERVAL_MS:-1000}
      IDENTITY_PRESENTATION_RECONCILIATION_BATCH_SIZE: ${IDENTITY_PRESENTATION_RECONCILIATION_BATCH_SIZE:-100}
      IDENTITY_KMS_ENABLED_PROVIDERS: ${IDENTITY_KMS_ENABLED_PROVIDERS:-development}
      IDENTITY_KMS_DEFAULT_PROVIDER: ${IDENTITY_KMS_DEFAULT_PROVIDER:-development}
      IDENTITY_KMS_ALLOWED_ALGORITHMS: ${IDENTITY_KMS_ALLOWED_ALGORITHMS:-Ed25519}
      IDENTITY_KMS_DEVELOPMENT_PROVIDER_ENABLED: ${IDENTITY_KMS_DEVELOPMENT_PROVIDER_ENABLED:-true}
      IDENTITY_KMS_PROHIBIT_DEVELOPMENT_IN_PRODUCTION: ${IDENTITY_KMS_PROHIBIT_DEVELOPMENT_IN_PRODUCTION:-true}
      IDENTITY_KMS_REMOTE_PROVIDER_NAME: ${IDENTITY_KMS_REMOTE_PROVIDER_NAME:-remote-kms}
      IDENTITY_KMS_REMOTE_BASE_URL: ${IDENTITY_KMS_REMOTE_BASE_URL:-}
      IDENTITY_KMS_REMOTE_AUTH_TOKEN_ENV: ${IDENTITY_KMS_REMOTE_AUTH_TOKEN_ENV:-IDENTITY_KMS_REMOTE_AUTH_TOKEN}
      IDENTITY_KMS_REMOTE_AUTH_TOKEN: ${IDENTITY_KMS_REMOTE_AUTH_TOKEN:-}
      IDENTITY_KMS_CONNECT_TIMEOUT_SECONDS: ${IDENTITY_KMS_CONNECT_TIMEOUT_SECONDS:-2}
      IDENTITY_KMS_REQUEST_TIMEOUT_SECONDS: ${IDENTITY_KMS_REQUEST_TIMEOUT_SECONDS:-5}
      IDENTITY_KMS_RETRY_COUNT: ${IDENTITY_KMS_RETRY_COUNT:-2}
      IDENTITY_KMS_RETRY_BACKOFF_MS: ${IDENTITY_KMS_RETRY_BACKOFF_MS:-100}
      IDENTITY_KMS_TLS_VERIFY: ${IDENTITY_KMS_TLS_VERIFY:-true}
      IDENTITY_KMS_CLIENT_CERTIFICATE_PATH: ${IDENTITY_KMS_CLIENT_CERTIFICATE_PATH:-}
      IDENTITY_KMS_CLIENT_KEY_PATH: ${IDENTITY_KMS_CLIENT_KEY_PATH:-}
      IDENTITY_KMS_CIRCUIT_FAILURE_THRESHOLD: ${IDENTITY_KMS_CIRCUIT_FAILURE_THRESHOLD:-5}
      IDENTITY_KMS_CIRCUIT_RESET_SECONDS: ${IDENTITY_KMS_CIRCUIT_RESET_SECONDS:-30}
      IDENTITY_KMS_ROTATION_INTERVAL_DAYS: ${IDENTITY_KMS_ROTATION_INTERVAL_DAYS:-90}
      IDENTITY_KMS_ROTATION_GRACE_SECONDS: ${IDENTITY_KMS_ROTATION_GRACE_SECONDS:-0}
      IDENTITY_KMS_DESTRUCTION_DELAY_HOURS: ${IDENTITY_KMS_DESTRUCTION_DELAY_HOURS:-24}
      IDENTITY_KMS_RECONCILIATION_ENABLED: ${IDENTITY_KMS_RECONCILIATION_ENABLED:-true}
      IDENTITY_KMS_RECONCILIATION_INTERVAL_MS: ${IDENTITY_KMS_RECONCILIATION_INTERVAL_MS:-1000}
      IDENTITY_KMS_RECONCILIATION_BATCH_SIZE: ${IDENTITY_KMS_RECONCILIATION_BATCH_SIZE:-100}
      IDENTITY_KMS_STALE_OPERATION_SECONDS: ${IDENTITY_KMS_STALE_OPERATION_SECONDS:-60}
      IDENTITY_KMS_RECONCILIATION_LEASE_SECONDS: ${IDENTITY_KMS_RECONCILIATION_LEASE_SECONDS:-30}
      IDENTITY_KMS_RECONCILIATION_RETRY_LIMIT: ${IDENTITY_KMS_RECONCILIATION_RETRY_LIMIT:-5}
      IDENTITY_RECOVERY_GRANT_ISSUER: ${IDENTITY_RECOVERY_GRANT_ISSUER:-secure-ssi-recovery-service}
      IDENTITY_RECOVERY_GRANT_AUDIENCE: ${IDENTITY_RECOVERY_GRANT_AUDIENCE:-identity-service-recovery}
      IDENTITY_RECOVERY_GRANT_SECRET: ${IDENTITY_RECOVERY_GRANT_SECRET:-}
      IDENTITY_RECOVERY_GRANT_LIFETIME_SECONDS: ${IDENTITY_RECOVERY_GRANT_LIFETIME_SECONDS:-60}
      IDENTITY_RECOVERY_GRANT_CLOCK_SKEW_SECONDS: ${IDENTITY_RECOVERY_GRANT_CLOCK_SKEW_SECONDS:-5}
    depends_on:
      mongodb:
        condition: service_healthy
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  fraud-service:
    build: ./services/fraud-service
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
    ports: ["8002:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  recovery-service:
    build: ./services/recovery-service
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      RECOVERY_ENVIRONMENT: ${RECOVERY_ENVIRONMENT:-development}
      RECOVERY_MONGO_ENABLED: ${RECOVERY_MONGO_ENABLED:-true}
      RECOVERY_MONGO_URI: ${RECOVERY_MONGO_URI:-mongodb://recovery_app:change-me-recovery@mongodb:27017/secure_recovery?authSource=secure_recovery}
      RECOVERY_MONGO_DATABASE: ${RECOVERY_MONGO_DATABASE:-secure_recovery}
      RECOVERY_MONGO_TIMEOUT_MS: ${RECOVERY_MONGO_TIMEOUT_MS:-3000}
      RECOVERY_AUTH_JWT_ISSUER: ${RECOVERY_AUTH_JWT_ISSUER:-secure-ssi-identity-service}
      RECOVERY_AUTH_JWT_AUDIENCE: ${RECOVERY_AUTH_JWT_AUDIENCE:-identity-service}
      RECOVERY_AUTH_JWT_ALGORITHM: ${RECOVERY_AUTH_JWT_ALGORITHM:-HS256}
      RECOVERY_AUTH_JWT_SECRET: ${RECOVERY_AUTH_JWT_SECRET:-}
      RECOVERY_AUTH_CLOCK_SKEW_SECONDS: ${RECOVERY_AUTH_CLOCK_SKEW_SECONDS:-10}
      RECOVERY_IDENTITY_BASE_URL: ${RECOVERY_IDENTITY_BASE_URL:-http://identity-service:8000}
      RECOVERY_IDENTITY_GRANT_ISSUER: ${RECOVERY_IDENTITY_GRANT_ISSUER:-secure-ssi-recovery-service}
      RECOVERY_IDENTITY_GRANT_AUDIENCE: ${RECOVERY_IDENTITY_GRANT_AUDIENCE:-identity-service-recovery}
      RECOVERY_IDENTITY_GRANT_SECRET: ${RECOVERY_IDENTITY_GRANT_SECRET:-}
      RECOVERY_IDENTITY_GRANT_LIFETIME_SECONDS: ${RECOVERY_IDENTITY_GRANT_LIFETIME_SECONDS:-60}
      RECOVERY_IDENTITY_TIMEOUT_SECONDS: ${RECOVERY_IDENTITY_TIMEOUT_SECONDS:-5}
      RECOVERY_SHARE_ENVELOPE_KEY_BASE64: ${RECOVERY_SHARE_ENVELOPE_KEY_BASE64:-}
      RECOVERY_DEFAULT_MINIMUM_APPROVALS: ${RECOVERY_DEFAULT_MINIMUM_APPROVALS:-3}
      RECOVERY_DEFAULT_MAXIMUM_GUARDIANS: ${RECOVERY_DEFAULT_MAXIMUM_GUARDIANS:-5}
      RECOVERY_DEFAULT_APPROVAL_WINDOW_SECONDS: ${RECOVERY_DEFAULT_APPROVAL_WINDOW_SECONDS:-3600}
      RECOVERY_DEFAULT_TIME_LOCK_SECONDS: ${RECOVERY_DEFAULT_TIME_LOCK_SECONDS:-300}
      RECOVERY_DEFAULT_EXPIRATION_SECONDS: ${RECOVERY_DEFAULT_EXPIRATION_SECONDS:-86400}
      RECOVERY_DEFAULT_MAXIMUM_ATTEMPTS: ${RECOVERY_DEFAULT_MAXIMUM_ATTEMPTS:-3}
      RECOVERY_DEFAULT_COOLDOWN_SECONDS: ${RECOVERY_DEFAULT_COOLDOWN_SECONDS:-3600}
      RECOVERY_RECONCILIATION_ENABLED: ${RECOVERY_RECONCILIATION_ENABLED:-true}
      RECOVERY_RECONCILIATION_POLL_INTERVAL_MS: ${RECOVERY_RECONCILIATION_POLL_INTERVAL_MS:-1000}
      RECOVERY_RECONCILIATION_BATCH_SIZE: ${RECOVERY_RECONCILIATION_BATCH_SIZE:-100}
      RECOVERY_RECONCILIATION_LEASE_SECONDS: ${RECOVERY_RECONCILIATION_LEASE_SECONDS:-30}
      RECOVERY_RECONCILIATION_STALE_SECONDS: ${RECOVERY_RECONCILIATION_STALE_SECONDS:-60}
    depends_on:
      identity-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports: ["8003:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-prototype}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-secure_identity}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-identity_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-change-me-app}
      MONGO_RECOVERY_DATABASE: ${MONGO_RECOVERY_DATABASE:-secure_recovery}
      MONGO_RECOVERY_USERNAME: ${MONGO_RECOVERY_USERNAME:-recovery_app}
      MONGO_RECOVERY_PASSWORD: ${MONGO_RECOVERY_PASSWORD:-change-me-recovery}
    ports: ["27017:27017"]
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/mongodb/init-application-user.js:/docker-entrypoint-initdb.d/10-application-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
