<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E3A6E" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0E1A33" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B2D7A" stop-opacity=".8"/>
      <stop offset="1" stop-color="#121433" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F4C5C" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0B1F2E" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 330 -460 0 820 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D8BFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6D8BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#A9C1FF" fill-opacity=".18"/>
    </pattern>
  </defs>
  <rect x="380" y="0" width="820" height="720" fill="url(#dots)" opacity=".6"/>
  <ellipse cx="820" cy="360" rx="460" ry="330" fill="url(#glow)"/>
  <g stroke="#9DB6FF" stroke-opacity=".22" stroke-width="1.5">
    <circle cx="830" cy="360" r="250"/>
    <circle cx="830" cy="360" r="320" stroke-dasharray="4 10"/>
  </g>
  <!-- back credential -->
  <g transform="rotate(-16 760 330)">
    <rect x="590" y="200" width="360" height="226" rx="22" fill="url(#cardC)" stroke="#7FE0D2" stroke-opacity=".45" stroke-width="2"/>
    <rect x="620" y="232" width="120" height="10" rx="5" fill="#CFFAF1" fill-opacity=".55"/>
    <rect x="620" y="254" width="80" height="7" rx="3.5" fill="#9FD9CF" fill-opacity=".4"/>
  </g>
  <!-- middle credential -->
  <g transform="rotate(-6 800 350)">
    <rect x="640" y="230" width="360" height="226" rx="22" fill="url(#cardB)" stroke="#B3A2FF" stroke-opacity=".5" stroke-width="2"/>
    <rect x="670" y="262" width="140" height="10" rx="5" fill="#E4DEFF" fill-opacity=".55"/>
    <rect x="670" y="284" width="96" height="7" rx="3.5" fill="#BCB2F2" fill-opacity=".4"/>
  </g>
  <!-- front credential -->
  <g transform="rotate(5 860 390)">
    <rect x="690" y="270" width="380" height="240" rx="24" fill="url(#card)" stroke="#A9C1FF" stroke-opacity=".6" stroke-width="2"/>
    <rect x="722" y="304" width="58" height="58" rx="16" fill="#4F7BFF" fill-opacity=".35" stroke="#A9C1FF" stroke-opacity=".6"/>
    <path d="M751 316l17 6v13c0 11-7 18-17 23-10-5-17-12-17-23v-13l17-6Z" stroke="#EAF0FF" stroke-width="2" stroke-linejoin="round"/>
    <path d="m743 335 6 6 11-12" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="798" y="312" width="170" height="11" rx="5.5" fill="#EAF0FF" fill-opacity=".7"/>
    <rect x="798" y="334" width="118" height="8" rx="4" fill="#B8C8EE" fill-opacity=".5"/>
    <path d="M722 392h316" stroke="#A9C1FF" stroke-opacity=".22" stroke-width="2"/>
    <rect x="722" y="414" width="120" height="8" rx="4" fill="#C9D6F5" fill-opacity=".45"/>
    <rect x="722" y="434" width="170" height="8" rx="4" fill="#C9D6F5" fill-opacity=".35"/>
    <rect x="722" y="454" width="96" height="8" rx="4" fill="#C9D6F5" fill-opacity=".3"/>
    <!-- QR -->
    <g transform="translate(948 410)" fill="#EAF0FF" fill-opacity=".75">
      <rect width="80" height="80" rx="10" fill="#0B1428" fill-opacity=".6" stroke="#A9C1FF" stroke-opacity=".4"/>
      <rect x="10" y="10" width="20" height="20" rx="3"/><rect x="50" y="10" width="20" height="20" rx="3"/>
      <rect x="10" y="50" width="20" height="20" rx="3"/><rect x="38" y="38" width="8" height="8"/>
      <rect x="54" y="54" width="8" height="8"/><rect x="62" y="40" width="8" height="8"/><rect x="40" y="62" width="8" height="8"/>
    </g>
  </g>
  <!-- wallet -->
  <g transform="translate(470 430)">
    <rect width="210" height="150" rx="26" fill="#0D1830" fill-opacity=".7" stroke="#8FA9F5" stroke-opacity=".5" stroke-width="2"/>
    <path d="M0 52h210" stroke="#8FA9F5" stroke-opacity=".3" stroke-width="2"/>
    <rect x="136" y="70" width="88" height="48" rx="16" fill="#1A2B55" stroke="#A9C1FF" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="164" cy="94" r="9" fill="#5EEAD4" fill-opacity=".8"/>
  </g>
  <g fill="#5EEAD4">
    <circle cx="590" cy="170" r="4"/><circle cx="1080" cy="220" r="3"/><circle cx="1110" cy="560" r="4"/><circle cx="560" cy="620" r="3"/>
  </g>
  <g stroke="#5EEAD4" stroke-opacity=".35" stroke-width="1.5">
    <path d="M590 170 700 230M1080 220 1000 300M1110 560 1040 500M560 620 600 580"/>
  </g>
</svg>
