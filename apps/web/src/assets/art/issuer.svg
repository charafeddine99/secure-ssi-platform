<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20366A" stop-opacity=".88"/>
      <stop offset="1" stop-color="#0D1730" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 320 -440 0 830 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seal" cx="0" cy="0" r="1" gradientTransform="matrix(0 62 -62 0 0 0)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5C451" stop-opacity=".9"/>
      <stop offset="1" stop-color="#B7791F" stop-opacity=".75"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#A9C1FF" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect x="400" y="0" width="800" height="720" fill="url(#grid)"/>
  <ellipse cx="830" cy="360" rx="440" ry="320" fill="url(#glow)"/>
  <!-- document stack -->
  <rect x="690" y="150" width="340" height="440" rx="20" transform="rotate(8 860 370)" fill="#152447" fill-opacity=".5" stroke="#8FA9F5" stroke-opacity=".25" stroke-width="2"/>
  <rect x="670" y="140" width="340" height="440" rx="20" transform="rotate(3 840 360)" fill="#172A52" fill-opacity=".6" stroke="#8FA9F5" stroke-opacity=".3" stroke-width="2"/>
  <!-- certificate -->
  <g>
    <rect x="640" y="130" width="350" height="460" rx="22" fill="url(#doc)" stroke="#B9C9FF" stroke-opacity=".6" stroke-width="2"/>
    <rect x="662" y="152" width="306" height="416" rx="14" stroke="#B9C9FF" stroke-opacity=".25" stroke-dasharray="6 8"/>
    <rect x="720" y="196" width="190" height="14" rx="7" fill="#EEF2FF" fill-opacity=".75"/>
    <rect x="752" y="222" width="126" height="8" rx="4" fill="#C3CDF0" fill-opacity=".5"/>
    <path d="M690 262h250" stroke="#B9C9FF" stroke-opacity=".25" stroke-width="2"/>
    <g fill="#C9D6F5">
      <rect x="690" y="290" width="70" height="7" rx="3.5" fill-opacity=".45"/><rect x="780" y="290" width="150" height="7" rx="3.5" fill-opacity=".65"/>
      <rect x="690" y="318" width="70" height="7" rx="3.5" fill-opacity=".45"/><rect x="780" y="318" width="120" height="7" rx="3.5" fill-opacity=".65"/>
      <rect x="690" y="346" width="70" height="7" rx="3.5" fill-opacity=".45"/><rect x="780" y="346" width="136" height="7" rx="3.5" fill-opacity=".65"/>
      <rect x="690" y="374" width="70" height="7" rx="3.5" fill-opacity=".45"/><rect x="780" y="374" width="96" height="7" rx="3.5" fill-opacity=".65"/>
    </g>
    <!-- signature -->
    <path d="M692 500c22-34 36-34 40-8 4 24 18 2 30-18 10-16 20-6 18 10-2 14 14 10 26-4 10-12 24-12 34 0" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M690 520h170" stroke="#B9C9FF" stroke-opacity=".35" stroke-width="1.5"/>
    <!-- seal -->
    <g transform="translate(920 500)">
      <path d="M-24 34 -34 92 0 74 34 92 24 34" fill="#7C3AED" fill-opacity=".55" stroke="#C4B5FD" stroke-opacity=".6"/>
      <circle r="58" fill="url(#seal)"/>
      <circle r="46" stroke="#FFF7E0" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/>
      <path d="m-18 0 12 12 24-26" stroke="#1B1405" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- pen nib -->
  <g transform="translate(470 420) rotate(-35)" stroke="#A9C1FF" stroke-opacity=".7" stroke-width="2">
    <path d="M0 0h40v120l-20 40-20-40Z" fill="#101C38" fill-opacity=".7"/>
    <path d="M20 120v24"/>
    <circle cx="20" cy="110" r="5" fill="#5EEAD4" stroke="none"/>
  </g>
  <g stroke="#8B7CFF" stroke-opacity=".3" stroke-width="1.5" fill="none">
    <path d="M1060 140c60 80 70 200 20 300"/>
    <path d="M560 160c-50 70-60 150-30 230"/>
  </g>
  <g fill="#F5C451" fill-opacity=".8">
    <circle cx="1070" cy="150" r="4"/><circle cx="1085" cy="430" r="3"/><circle cx="560" cy="160" r="3"/>
  </g>
</svg>
