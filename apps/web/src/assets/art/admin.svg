<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1C2F5C" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0C152B" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 330 -460 0 820 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D8BFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6D8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5EEAD4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#A9C1FF" fill-opacity=".2"/>
    </pattern>
  </defs>
  <rect x="420" width="780" height="720" fill="url(#dots)" opacity=".6"/>
  <ellipse cx="820" cy="360" rx="460" ry="330" fill="url(#glow)"/>
  <!-- main dashboard panel -->
  <rect x="640" y="150" width="440" height="280" rx="22" fill="url(#panel)" stroke="#A9C1FF" stroke-opacity=".55" stroke-width="2"/>
  <g fill="#EAF0FF"><circle cx="668" cy="178" r="5" fill-opacity=".5"/><circle cx="686" cy="178" r="5" fill-opacity=".35"/><circle cx="704" cy="178" r="5" fill-opacity=".2"/></g>
  <path d="M640 200h440" stroke="#A9C1FF" stroke-opacity=".2"/>
  <path d="M670 380 730 330l50 22 60-70 60 40 60-56 60 30v104H670Z" fill="url(#area)"/>
  <path d="M670 380 730 330l50 22 60-70 60 40 60-56 60 30" stroke="#5EEAD4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#C9D6F5" fill-opacity=".5"><rect x="670" y="222" width="110" height="9" rx="4.5"/><rect x="670" y="242" width="70" height="7" rx="3.5" fill-opacity=".35"/></g>
  <!-- stat tiles -->
  <g>
    <rect x="640" y="452" width="138" height="96" rx="18" fill="#101C38" fill-opacity=".72" stroke="#A9C1FF" stroke-opacity=".4"/>
    <rect x="791" y="452" width="138" height="96" rx="18" fill="#101C38" fill-opacity=".72" stroke="#A9C1FF" stroke-opacity=".4"/>
    <rect x="942" y="452" width="138" height="96" rx="18" fill="#101C38" fill-opacity=".72" stroke="#A9C1FF" stroke-opacity=".4"/>
    <circle cx="672" cy="486" r="12" fill="#5EEAD4" fill-opacity=".35"/><circle cx="823" cy="486" r="12" fill="#6D8BFF" fill-opacity=".4"/><circle cx="974" cy="486" r="12" fill="#F5C451" fill-opacity=".4"/>
    <g fill="#EAF0FF" fill-opacity=".6"><rect x="660" y="512" width="70" height="10" rx="5"/><rect x="811" y="512" width="56" height="10" rx="5"/><rect x="962" y="512" width="84" height="10" rx="5"/></g>
  </g>
  <!-- server stack -->
  <g transform="translate(450 220)" stroke="#8FA9F5" stroke-opacity=".55" stroke-width="2">
    <rect width="140" height="58" rx="14" fill="#0D1830" fill-opacity=".72"/>
    <rect y="72" width="140" height="58" rx="14" fill="#0D1830" fill-opacity=".72"/>
    <rect y="144" width="140" height="58" rx="14" fill="#0D1830" fill-opacity=".72"/>
    <g fill="#5EEAD4" stroke="none"><circle cx="112" cy="29" r="6"/><circle cx="112" cy="101" r="6"/><circle cx="112" cy="173" r="6" fill="#F5C451"/></g>
    <g stroke-opacity=".35"><path d="M20 29h56M20 101h56M20 173h56"/></g>
  </g>
  <!-- links -->
  <g stroke="#A9C1FF" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="4 6">
    <path d="M590 249h50M590 321c30 0 30 110 50 160M590 393c40 0 30-90 50-120"/>
  </g>
  <g fill="#5EEAD4"><circle cx="1110" cy="130" r="4"/><circle cx="1120" cy="600" r="3"/><circle cx="520" cy="580" r="4"/></g>
</svg>
