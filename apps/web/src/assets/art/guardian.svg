    <g transform="translate(947 520)"><circle r="34" fill="#103B3A" stroke="#5EEAD4"/><circle cy="-8" r="9" fill="#CCFBF1" fill-opacity=".85"/><path d="M-16 18c4-12 28-12 32 0" stroke="#CCFBF1" stroke-linecap="round"/></g>
