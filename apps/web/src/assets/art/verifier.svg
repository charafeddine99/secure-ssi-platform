<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#123B55" stop-opacity=".88"/>
      <stop offset="1" stop-color="#0A1A2C" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 330 -450 0 820 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5EEAD4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="820" cy="360" rx="450" ry="330" fill="url(#glow)"/>
  <!-- radar arcs -->
  <g stroke="#7DD3C7" stroke-opacity=".22" stroke-width="1.5">
    <circle cx="820" cy="360" r="140"/><circle cx="820" cy="360" r="220"/><circle cx="820" cy="360" r="300" stroke-dasharray="3 9"/>
    <path d="M820 60v600M520 360h600" stroke-dasharray="2 8"/>
  </g>
  <!-- scanned credential -->
  <rect x="660" y="250" width="320" height="200" rx="20" fill="url(#card)" stroke="#7DD3C7" stroke-opacity=".55" stroke-width="2"/>
  <rect x="690" y="282" width="50" height="50" rx="14" fill="#14B8A6" fill-opacity=".3" stroke="#7DD3C7" stroke-opacity=".6"/>
  <rect x="756" y="290" width="150" height="10" rx="5" fill="#E6FFFA" fill-opacity=".7"/>
  <rect x="756" y="310" width="100" height="7" rx="3.5" fill="#A7E3DA" fill-opacity=".5"/>
  <rect x="690" y="356" width="260" height="7" rx="3.5" fill="#C6E9E3" fill-opacity=".35"/>
  <rect x="690" y="376" width="200" height="7" rx="3.5" fill="#C6E9E3" fill-opacity=".3"/>
  <rect x="690" y="396" width="230" height="7" rx="3.5" fill="#C6E9E3" fill-opacity=".25"/>
  <!-- scan frame corners -->
  <g stroke="#5EEAD4" stroke-width="4" stroke-linecap="round">
    <path d="M630 260v-40h40M1010 260v-40h-40M630 440v40h40M1010 440v40h-40"/>
  </g>
  <rect x="640" y="340" width="360" height="3" fill="url(#beam)"/>
  <!-- checklist -->
  <g transform="translate(450 170)">
    <rect width="170" height="230" rx="18" fill="#0D1A2E" fill-opacity=".72" stroke="#8FB3D9" stroke-opacity=".45" stroke-width="2"/>
    <g stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
      <path d="m24 44 8 8 14-16" stroke="#5EEAD4"/>
      <path d="m24 90 8 8 14-16" stroke="#5EEAD4"/>
      <path d="m24 136 8 8 14-16" stroke="#5EEAD4"/>
      <path d="m26 178 16 16M42 178l-16 16" stroke="#F87171"/>
    </g>
    <g fill="#C6D7EE">
      <rect x="62" y="40" width="84" height="8" rx="4" fill-opacity=".55"/>
      <rect x="62" y="86" width="70" height="8" rx="4" fill-opacity=".55"/>
      <rect x="62" y="132" width="90" height="8" rx="4" fill-opacity=".55"/>
      <rect x="62" y="182" width="64" height="8" rx="4" fill-opacity=".55"/>
    </g>
  </g>
  <!-- magnifier -->
  <g transform="translate(1010 470)" stroke="#A9C1FF" stroke-opacity=".75" stroke-width="5" stroke-linecap="round">
    <circle r="46" fill="#0B1628" fill-opacity=".6"/>
    <path d="M34 34l46 46"/>
    <path d="m-16 0 10 10 22-22" stroke="#5EEAD4" stroke-width="4"/>
  </g>
  <g fill="#5EEAD4">
    <circle cx="960" cy="140" r="4"/><circle cx="1110" cy="300" r="3"/><circle cx="560" cy="560" r="4"/>
  </g>
</svg>
